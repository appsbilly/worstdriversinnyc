name: Refresh leaderboard

on:
  schedule:
    # 04:00 UTC daily ≈ midnight EDT / 11pm EST.
    # Picked so a worst-case 5h bootstrap run still finishes before nyc wakes up,
    # and daily incremental runs (~5 min) are well clear of morning traffic.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      rows_target:
        description: "Number of rows to ingest (default 80,000,000 — script stops at end-of-dataset before that)"
        required: false
        default: "80000000"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Restore the accumulated plate-state file from a previous run.
      # If this is the very first run, the cache miss is expected and the
      # script bootstraps from scratch.
      - name: Restore plate state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: ./state.json.gz
          key: nyc-plate-state-${{ github.run_id }}
          restore-keys: |
            nyc-plate-state-

      - name: Refresh leaderboard in Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NYC_OPEN_DATA_APP_TOKEN: ${{ secrets.NYC_OPEN_DATA_APP_TOKEN }}
          ROWS_TARGET: ${{ github.event.inputs.rows_target || '80000000' }}
          # Bootstrap holds ~6M plate entries plus windowed aggregators in memory.
          # Default Node heap (~1.7GB) is not enough — runners have 7GB.
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run refresh-leaderboard

      # Always save the updated state, even if a downstream step failed —
      # the script writes state.json.gz at the end of a successful scan, and
      # we want subsequent runs to pick up that progress.
      - name: Save plate state
        if: always() && hashFiles('./state.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: ./state.json.gz
          key: nyc-plate-state-${{ github.run_id }}
