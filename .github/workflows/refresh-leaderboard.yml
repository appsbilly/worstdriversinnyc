name: Refresh leaderboard

on:
  schedule:
    # 08:00 UTC daily ≈ 4am ET
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      rows_target:
        description: "Number of rows to ingest (default 5,000,000 ≈ ~6 months of NYC tickets)"
        required: false
        default: "5000000"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Refresh leaderboard in Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NYC_OPEN_DATA_APP_TOKEN: ${{ secrets.NYC_OPEN_DATA_APP_TOKEN }}
          ROWS_TARGET: ${{ github.event.inputs.rows_target || '5000000' }}
        run: npm run refresh-leaderboard
